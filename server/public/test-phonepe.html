<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhonePe Payment Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <div class="max-w-md mx-auto bg-white rounded-lg shadow-lg p-6">
            <div class="text-center mb-6">
                <h1 class="text-2xl font-bold text-gray-900 mb-2">PhonePe Payment Test</h1>
                <p class="text-gray-600">Test the PhonePe integration</p>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Amount (₹)</label>
                    <input type="number" id="amount" value="100" min="1" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Booking ID (Optional)</label>
                    <input type="text" id="bookingId" placeholder="test-booking-id" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                </div>

                <button onclick="testPayment()" class="w-full bg-blue-600 text-white py-3 px-4 rounded-lg font-semibold hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
                    Test PhonePe Payment
                </button>
            </div>

            <div id="result" class="mt-6 hidden">
                <h3 class="font-semibold mb-2">Result:</h3>
                <pre id="resultText" class="bg-gray-100 p-4 rounded-lg text-sm overflow-auto"></pre>
            </div>
        </div>
    </div>

    <script>
        async function testPayment() {
            const amount = document.getElementById('amount').value;
            const bookingId = document.getElementById('bookingId').value;
            const resultDiv = document.getElementById('result');
            const resultText = document.getElementById('resultText');

            try {
                console.log('Testing PhonePe payment with:', { amount, bookingId });

                const merchantTransactionId = `TXN_${Date.now()}_${Math.floor(Math.random() * 1000)}`;
                
                const response = await fetch('/api/phonepe/create', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        amount: parseInt(amount),
                        merchantTransactionId,
                        bookingId: bookingId || undefined
                    })
                });

                const result = await response.json();
                console.log('PhonePe response:', result);

                resultDiv.classList.remove('hidden');
                resultText.textContent = JSON.stringify(result, null, 2);

                if (result.success && result.data) {
                    // Show success message
                    resultText.className = 'bg-green-100 p-4 rounded-lg text-sm overflow-auto text-green-800';
                    
                    // Optionally redirect to payment URL
                    if (confirm('Payment initiated successfully! Would you like to proceed to PhonePe?')) {
                        window.location.href = result.data.paymentUrl;
                    }
                } else {
                    // Show error message
                    resultText.className = 'bg-red-100 p-4 rounded-lg text-sm overflow-auto text-red-800';
                }
            } catch (error) {
                console.error('Error testing payment:', error);
                resultDiv.classList.remove('hidden');
                resultText.className = 'bg-red-100 p-4 rounded-lg text-sm overflow-auto text-red-800';
                resultText.textContent = `Error: ${error.message}`;
            }
        }
    </script>
</body>
</html>
