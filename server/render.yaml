services:
  - type: web
    name: vehicle-cleaning-api
    env: node
    plan: free
    buildCommand: npm install && cd ../client && npm install && npm run build && cd ../server && mkdir -p ../client/build && cp -r ../client/build .
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: MSG91_API_KEY
        sync: false
      - key: PHONEPE_MERCHANT_ID
        sync: false
      - key: PHONEPE_CLIENT_ID
        sync: false
      - key: PHONEPE_CLIENT_SECRET
        sync: false
