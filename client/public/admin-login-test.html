<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login Test</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 500px;
      margin: 0 auto;
      padding: 20px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    input {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
    }
    button {
      background-color: #4CAF50;
      color: white;
      padding: 10px 15px;
      border: none;
      cursor: pointer;
    }
    .result {
      margin-top: 20px;
      padding: 10px;
      border: 1px solid #ddd;
      background-color: #f9f9f9;
    }
    .error {
      color: red;
    }
    .success {
      color: green;
    }
    .warning-box {
      background-color: #ffeeee;
      padding: 15px;
      border-radius: 5px;
      border: 2px solid #ff6666;
      margin: 20px 0;
      font-size: 16px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>Admin Login Test</h1>
  
  <div class="warning-box">
    <p>⚠️ IMPORTANT: The correct password is <code>testpassword123</code></p>
    <p>❌ DO NOT use <code>Sandesh29</code> - it will NOT work!</p>
  </div>
  
  <div class="form-group">
    <label for="phone">Phone Number:</label>
    <input type="text" id="phone" value="+919303228082">
  </div>
  
  <div class="form-group">
    <label for="password">Password:</label>
    <input type="password" id="password" value="testpassword123">
  </div>
  
  <button onclick="testLogin()">Test Login</button>
  
  <div id="result" class="result">
    <p>Results will appear here...</p>
  </div>
  
  <script>
    async function testLogin() {
      const resultDiv = document.getElementById('result');
      resultDiv.innerHTML = '<p>Testing login...</p>';
      
      const phone = document.getElementById('phone').value;
      const password = document.getElementById('password').value;
      
      try {
        console.log('🔍 Testing admin login directly via API');
        console.log('📤 Sending login request with:', {
          phone,
          passwordLength: password.length
        });
        
        // Make the request to the login endpoint
        const response = await fetch('http://localhost:5001/api/auth/login-password', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ phone, password })
        });
        
        const data = await response.json();
        
        if (response.ok) {
          console.log('✅ Login successful!');
          console.log('📋 Response data:', {
            success: data.success,
            message: data.message,
            user: data.data?.user ? {
              name: data.data.user.name,
              role: data.data.user.role,
              phone: data.data.user.phone
            } : null,
            hasToken: !!data.data?.token
          });
          
          // Store the token and user in localStorage
          if (data.data?.token && data.data?.user) {
            localStorage.setItem('token', data.data.token);
            localStorage.setItem('user', JSON.stringify(data.data.user));
            console.log('✅ Token and user stored in localStorage');
          }
          
          resultDiv.innerHTML = `
            <p class="success">✅ Login successful!</p>
            <p><strong>User:</strong> ${data.data.user.name}</p>
            <p><strong>Role:</strong> ${data.data.user.role}</p>
            <p><strong>Phone:</strong> ${data.data.user.phone}</p>
            <p><strong>Token:</strong> ${data.data.token.substring(0, 20)}...</p>
          `;
        } else {
          console.error('❌ Login failed:', data.message);
          resultDiv.innerHTML = `<p class="error">❌ Login failed: ${data.message}</p>`;
        }
      } catch (error) {
        console.error('❌ Error:', error);
        resultDiv.innerHTML = `<p class="error">❌ Error: ${error.message}</p>`;
      }
    }
  </script>
</body>
</html>
